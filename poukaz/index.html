<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uplatniť darčekový poukaz · Naše rozprávky</title>
<meta name="description" content="Uplatnite darčekový poukaz na adventnú rozprávku s menom vášho dieťaťa.">
<link rel="canonical" href="https://www.naserozpravky.sk/poukaz/">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
body{margin:0;background:#FBF8F1;color:#2A2D3E;font-family:'DM Sans',Arial,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:40px 20px 60px}
h1{font-family:'Shantell Sans','Nunito',sans-serif;font-variation-settings:'INFM' 100,'BNCE' 35;font-size:34px;line-height:1.15;margin:16px 0 8px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Shantell Sans',sans-serif;font-variation-settings:'INFM' 100,'BNCE' 35;font-weight:700;font-size:20px;text-decoration:none;color:#2A2D3E}
form{background:#fff;border:1.6px solid #45454D;border-radius:24px 10px 22px 12px / 12px 22px 10px 24px;padding:20px;margin-top:20px;display:flex;flex-direction:column;gap:12px}
label{font-weight:700}
input{min-height:52px;padding:12px 14px;border:2px solid #C9CCD9;border-radius:14px;font:inherit;font-size:20px;letter-spacing:2px;text-transform:uppercase}
input:focus{outline:3px solid #F4B740;outline-offset:1px;border-color:#2A2D3E}
button{min-height:56px;border:1.8px solid #45454D;border-radius:26px 10px 24px 12px / 12px 24px 10px 26px;background:#CF3E2A;color:#fff;font:inherit;font-weight:700;font-size:18px;cursor:pointer}
.meta{color:#5A5F7A}
</style>
</head>
<body>
<main>
  <a class="logo" href="/"><img src="/assets/favicon.svg" width="30" height="30" alt="">Naše rozprávky</a>
  <h1>Uplatniť darčekový poukaz</h1>
  <p class="meta">Zadajte kód z poukazu. Potom napíšete meno dieťaťa a či je to dievčatko alebo chlapček, platiť už nič nebudete.</p>
  <form id="f">
    <label for="kod">Kód poukazu</label>
    <input id="kod" name="kod" placeholder="DAR-XXXXXX" autocomplete="off" maxlength="12" required>
    <button type="submit">Pokračovať</button>
  </form>
  <p class="meta" style="margin-top:20px">Ak meno dostaneme do 24. 11., rozprávku pošleme najneskôr 30. 11. Neskôr ju pošleme do 3 pracovných dní.</p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  function go(k) { location.href = '/objednavka/?kod=' + encodeURIComponent(k.trim().toUpperCase()); }
  if (q.get('kod')) { go(q.get('kod')); return; }
  document.getElementById('f').onsubmit = function (e) { e.preventDefault(); var k = document.getElementById('kod').value; if (k.trim()) go(k); };
})();
</script>
</body>
</html>
